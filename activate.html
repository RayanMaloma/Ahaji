<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><title>تفعيل الحساب · أحاجي</title><link rel="preconnect" href="https://gbhleqizxcmxmutgcjon.supabase.co" crossorigin><link rel="stylesheet" href="css/style.css?v=invite-1"></head>
<body class="auth-page">
  <div id="activation-loading" class="ahaji-loader ahaji-loader--page" role="status" data-loader><picture class="ahaji-loader__mark" aria-hidden="true"><source srcset="images/loader/ahaji-loader-reduced.svg" media="(prefers-reduced-motion: reduce)"><img src="images/loader/ahaji-loader.svg" alt="" width="96" height="86" decoding="async"></picture><span class="ahaji-loader__label">جارٍ التحقق من الدعوة…</span></div>
  <main class="auth-card activation-card" aria-labelledby="activation-title">
    <img src="images/ahajilogo.svg" alt="أحاجي" class="auth-logo">
    <p class="auth-eyebrow">تفعيل حساب فريق العمل</p>
    <h1 id="activation-title" tabindex="-1">مرحباً بك في أحاجي</h1>

    <section id="activation-welcome" hidden>
      <p class="auth-intro">وصلتك دعوة للانضمام إلى فريق أحاجي. تابع لإكمال التفعيل واختيار كلمة مرورك.</p>
      <button id="activation-continue" type="button" class="auth-primary">متابعة التفعيل</button>
    </section>

    <form id="activation-form" hidden novalidate>
      <p id="activation-intro" class="auth-intro"></p>
      <label for="activation-password">كلمة المرور</label>
      <div class="password-field">
        <input id="activation-password" type="password" autocomplete="new-password" dir="ltr" required aria-describedby="password-rules">
        <button type="button" class="password-toggle" data-toggle="activation-password" aria-pressed="false">إظهار</button>
      </div>
      <ul id="password-rules" class="password-rules" aria-label="متطلبات كلمة المرور"></ul>
      <label for="activation-confirm">تأكيد كلمة المرور</label>
      <input id="activation-confirm" type="password" autocomplete="new-password" dir="ltr" required aria-describedby="confirm-status">
      <p id="confirm-status" class="password-confirm" aria-live="polite"></p>
      <button id="activation-submit" type="submit" class="auth-primary">تفعيل حسابي</button>
    </form>

    <section id="activation-done" hidden>
      <p class="auth-intro" id="activation-done-text">تم تفعيل حسابك.</p>
      <a id="activation-next" class="auth-primary auth-button-link" href="index.html">الدخول إلى أحاجي</a>
    </section>

    <p id="activation-message" class="auth-message" role="alert" hidden></p>
    <a id="activation-login" href="login.html" class="auth-link" hidden>العودة إلى تسجيل الدخول</a>
  </main>
  <script type="module" src="js/auth/activate.mjs?v=invite-1"></script>
</body>
</html>
