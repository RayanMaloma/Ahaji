<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>فريق العمل · أحاجي</title><link rel="preconnect" href="https://gbhleqizxcmxmutgcjon.supabase.co" crossorigin><link rel="preconnect" href="https://gbhleqizxcmxmutgcjon.supabase.co"><link rel="stylesheet" href="css/style.css?v=bc-3"></head>
<body class="auth-page" data-protected-page="staff">
  <div id="auth-loading" class="ahaji-loader ahaji-loader--page" role="status" data-loader><picture class="ahaji-loader__mark" aria-hidden="true"><source srcset="images/loader/ahaji-loader-reduced.svg" media="(prefers-reduced-motion: reduce)"><img src="images/loader/ahaji-loader.svg" alt="" width="96" height="86" decoding="async"></picture><span class="ahaji-loader__label">جارٍ التحقق من صلاحية الدخول…</span></div>
  <div id="auth-failure" class="auth-status" role="alert" hidden></div>
  <main id="protected-content" class="auth-card" hidden>
    <img src="images/ahajilogo.svg" alt="Ahaji" class="auth-logo">
    <p class="auth-eyebrow">مساحة فريق العمل</p><h1 id="auth-role"></h1>
    <p id="auth-email" class="auth-intro" dir="ltr"></p>
    <a id="admin-dashboard-link" href="admin.html?view=rooms" class="auth-primary auth-button-link" hidden>فتح لوحة الإدارة</a>
    <p class="auth-intro">اختر إحدى الغرف المسموح لك بإدارتها.</p>
    <ul id="staff-rooms" class="staff-room-list"></ul>
    <form id="change-email-form" class="staff-email-form">
      <label for="new-email">تغيير البريد الإلكتروني للحساب</label>
      <input id="new-email" type="email" autocomplete="email" dir="ltr" required>
      <button class="auth-primary" type="submit">إرسال رابط التوثيق</button>
    </form>
    <p id="change-email-message" class="auth-message" role="status" hidden></p>
    <button type="button" data-logout class="auth-secondary">تسجيل الخروج</button>
  </main>
  <script type="module" src="js/auth/guard.mjs?v=bc-2"></script>
</body>
</html>
