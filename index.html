<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahaji — Select Room</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="index-page">

  <img src="images/ahajilogo.svg" alt="Ahaji" class="index-logo" />
  <p class="index-title">Select a Room</p>

  <div class="room-grid" id="room-grid"></div>

  <script src="js/app.js"></script>
  <script>
  // Index just routes the user into a Game Master page for the chosen room.
  // The GM page is responsible for generating its own sessionId and seeding
  // its own isolated state — multiple GM pages for the same room must each
  // get their own session, so index must not pre-seed any shared state here.
  const roomGrid = document.getElementById('room-grid');

  getRooms().forEach(room => {
    const card = document.createElement('div');
    card.className = 'room-card';
    card.dataset.room = room.id;

    const img = document.createElement('img');
    img.src = room.thumbnail;
    img.alt = room.name;

    const overlay = document.createElement('div');
    overlay.className = 'room-card-overlay';

    const name = document.createElement('span');
    name.className = 'room-card-name';
    name.textContent = room.name;

    overlay.appendChild(name);
    card.appendChild(img);
    card.appendChild(overlay);
    card.addEventListener('click', () => {
      window.location.href = `gm.html?room=${encodeURIComponent(room.id)}`;
    });

    roomGrid.appendChild(card);
  });
</script>
</body>
</html>
