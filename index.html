<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahaji — Select Room</title>
  <link rel="stylesheet" href="css/style.css?v=phase5-font-1" />
</head>
<body class="index-page">
  <div id="auth-loading" class="auth-status" role="status">Checking staff access…</div>
  <div id="auth-failure" class="auth-status" role="alert" hidden></div>
  <div id="protected-content" class="index-protected" hidden>
  <div class="auth-topbar"><span id="auth-role"></span><span id="auth-email"></span><a id="admin-dashboard-link" href="admin.html?view=rooms" hidden>لوحة الإدارة</a><a href="staff.html">Staff home</a><button type="button" data-logout>Log out</button></div>
  <img src="images/ahajilogo.svg" alt="Ahaji" class="index-logo" />
  <p class="index-title">Select a Room</p>

  <div class="room-grid" id="room-grid"></div>
  <p id="no-rooms" hidden>No rooms are assigned to your account yet.</p>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Supabase's configured Site URL points here. Keep the one-time
    // Auth fragment on the recovery page so the SDK can consume it there.
    if (/\btype=(recovery|magiclink|invite|signup)\b/.test(location.hash)) {
      location.replace('recover.html?setup=1' + location.hash);
    }
  </script>
  <script>document.body.dataset.protectedPage = 'index';</script>
  <script type="module" src="js/auth/guard.mjs"></script>
</body>
</html>
