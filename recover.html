<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>استعادة كلمة المرور · أحاجي</title><link rel="stylesheet" href="css/style.css?v=bc-1"></head>
<body class="auth-page">
  <main class="auth-card">
    <img src="images/ahajilogo.svg" alt="Ahaji" class="auth-logo">
    <p class="auth-eyebrow">دخول فريق العمل</p>
    <h1>استعادة كلمة المرور</h1>
    <p id="recovery-intro" class="auth-intro">أدخل بريد حسابك لتصلك رسالة إعادة تعيين كلمة المرور.</p>
    <form id="request-form">
      <label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" dir="ltr" required>
      <button id="request-submit" type="submit" class="auth-primary">إرسال رابط الاستعادة</button>
    </form>
    <form id="update-form" hidden>
      <label for="new-password">كلمة المرور الجديدة</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" dir="ltr" required>
      <button id="update-submit" type="submit" class="auth-primary">حفظ كلمة المرور</button>
    </form>
    <p id="recovery-message" class="auth-message" role="status" hidden></p>
    <a href="login.html" class="auth-link">العودة إلى تسجيل الدخول</a>
  </main>
  <script type="module" src="js/auth/recover.mjs"></script>
</body>
</html>
