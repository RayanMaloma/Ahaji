<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول · أحاجي</title><link rel="stylesheet" href="css/style.css?v=5"></head>
<body class="auth-page">
  <main class="auth-card">
    <img src="images/ahajilogo.svg" alt="Ahaji" class="auth-logo">
    <p class="auth-eyebrow">دخول فريق العمل</p>
    <h1>تسجيل الدخول</h1>
    <p class="auth-intro">أدخل بريدك الإلكتروني وكلمة المرور للوصول إلى حسابك في أحاجي.</p>
    <form id="login-form">
      <label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="username" dir="ltr" required>
      <label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required>
      <p id="login-error" class="auth-error" role="alert" hidden></p>
      <button id="login-submit" type="submit" class="auth-primary">دخول</button>
    </form>
    <a href="recover.html" class="auth-link">نسيت كلمة المرور؟</a>
  </main>
  <script type="module" src="js/auth/login.mjs"></script>
</body>
</html>
