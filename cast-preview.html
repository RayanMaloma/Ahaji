<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>معاينة شاشة العرض</title>
  <link rel="stylesheet" href="css/style.css?v=bc-2">
</head>
<body class="cast-page cast-preview-page" data-cast-stage>
  <img class="cast-bg" data-cast-bg alt="خلفية الغرفة">
  <div class="cast-overlay" data-cast-overlay></div>
  <img class="cast-logo" src="images/ahajilogo.svg" alt="Ahaji">
  <div class="cast-idle-room-name" data-cast-idle-name><span></span></div>
  <div class="cast-result-screen" data-cast-result-screen>
    <div class="cast-result-backdrop"></div>
    <div class="cast-result-particles cast-result-particles-win" aria-hidden="true"></div>
    <div class="cast-result-inner">
      <div class="cast-result-kicker" data-cast-result-kicker></div>
      <div class="cast-result-message" data-cast-result-message>
        <div class="cast-result-message-ar" data-cast-result-message-ar></div>
        <div class="cast-result-message-en" data-cast-result-message-en></div>
      </div>
      <div class="cast-result-time" data-cast-result-time></div>
    </div>
  </div>
  <div class="cast-content" data-cast-content>
    <div class="cast-timer-wrap"><div class="cast-timer" data-cast-timer>17:42</div></div>
    <div class="cast-hint-area"><div class="cast-hint-box" data-cast-hint-box>
      <div class="cast-hint-text" data-cast-hint-text></div>
    </div></div>
  </div>
  <script src="js/app.js?v=theme-1"></script>
  <script src="js/admin/cast-preview.js?v=refinement-1"></script>
</body>
</html>
